<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Ultimate Node.js Course — Zero to Principal Engineer (L7+)</title>
  <meta name="description" content="The most complete, beginner-friendly Node.js course on the planet. Learn Node from absolute zero to distinguished principal engineer with an in-browser editor, runnable code, and dozens of projects." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%9F%A2</text></svg>" />
  <link rel="stylesheet" href="assets/css/theme.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/content.css" />
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>

  <header class="app-header">
    <button id="sidebar-toggle" class="icon-btn" aria-label="Toggle table of contents" title="Toggle menu (m)">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3zM3 11h18v2H3zM3 16h18v2H3z"/></svg>
    </button>
    <a class="brand" href="#/" title="Course home">
      <span class="brand-logo" aria-hidden="true">🟢</span>
      <span class="brand-text">The Ultimate <strong>Node.js</strong> Course</span>
    </a>

    <div class="header-progress" title="Your overall progress">
      <div class="progress-track"><div id="overall-progress-bar" class="progress-fill" style="width:0%"></div></div>
      <span id="overall-progress-label" class="progress-label">0%</span>
    </div>

    <div class="header-actions">
      <button id="theme-toggle" class="icon-btn" aria-label="Toggle light/dark theme" title="Toggle theme (t)">
        <svg class="icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5l1.5 3h-3L12 2zm0 17l1.5 3h-3L12 19zM2 12l3-1.5v3L2 12zm17 0l3-1.5v3L19 12zM4.2 4.2l3 1.2-1.8 1.8-1.2-3zm12.6 12.6l3 1.2-1.2-3-1.8 1.8zM19.8 4.2l-1.2 3-1.8-1.8 3-1.2zM7.2 16.8l-1.2 3-1.8-1.8 3-1.2z"/></svg>
      </button>
    </div>
  </header>

  <div class="app-shell">
    <nav id="sidebar" class="sidebar" aria-label="Course table of contents">
      <div class="sidebar-head">
        <span class="sidebar-title">Curriculum</span>
        <span id="sidebar-stats" class="sidebar-stats"></span>
      </div>
      <div id="toc" class="toc" role="tree"></div>
    </nav>

    <div id="sidebar-scrim" class="sidebar-scrim" hidden></div>

    <main id="content" class="content" tabindex="-1">
      <!-- Rendered by the app -->
      <div class="loading-splash">Loading the course…</div>
    </main>
  </div>

  <!-- Monaco AMD loader (CDN, pinned). Needs network on first view. -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>

  <!-- App: classic scripts, load order matters (no bundler, file:// safe) -->
  <script src="js/manifest.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/monaco-loader.js"></script>
  <script src="js/runner.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/landing.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
